# Gamepad rubric overlay. Core dimensions and excluded categories depend on the gold
# draft, so every gold-dependent failure is downgraded until status becomes `approved`.
status: draft_pending_human_review
core_ids:
  - report_rate
  - button_lifetime
  - stick_lifetime
  - battery_runtime
  - charging_time
  - compatible_platform
  - connection_mode
  - stick_sensor
  - trigger_mode
  - button_mechanism
  - macro_recording
  - motion_control
  - vibration
  - vibration_motor_type
  - body_weight
  - body_dimensions
  - battery_capacity
  - power_source
excluded_keywords:
  - 价格
  - 售价
  - 质保
  - 保修
  - 退换
  - 赠品
  - 销量
  - 好评
  - 榜单
  - 评分
