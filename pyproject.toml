[project]
name = "shop-agent-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Liyang-Chen-UCLA", email = "cly0329@ucla.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-openai>=1.0.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[project.scripts]
shop-agent-langgraph = "shop_agent_langgraph.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
