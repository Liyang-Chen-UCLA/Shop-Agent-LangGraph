# Single source for schema-field wording: the EvalAgent prompt, Jev instructions and the
# human review question all render from here, so editing a definition changes all three.
review_question: "Does the actual representation preserve the gold dimension's `{field}` semantics? Score the field itself, not agreement with an automatic judge."
fields:
  - name: kind
    definition: >-
      Is the gold dimension represented as the correct criterion or attribute?
      A uniform actual kind must agree with gold. For mixed-kind groups identify the
      actual representation of this dimension using its name/description.
  - name: type
    definition: >-
      Numeric, boolean and categorical meanings must agree. Combining dimensions
      with incompatible types does not preserve a correct type.
  - name: units
    definition: >-
      Equivalent or convertible units pass for the same quantity when conversion
      preserves schema semantics. Unrelated, unsupported or missing required units fail.
      Order and harmless format differences do not matter.
  - name: formula
    definition: >-
      Compare mathematical meaning and conditions, not string spelling.
      null on both sides passes. Missing/extra formulas changing meaning fail.
  - name: direction
    definition: >-
      Compare preference semantics and conditions. Reversed direction,
      unsupported preferred values/order, or missing required direction fails.
  - name: values
    definition: >-
      Compare semantic coverage independently of order, wording and synonyms.
      Missing options or added non-equivalent options fail. An open domain allows
      future values; it does not erase differences in the current set.
  - name: value_domain
    definition: >-
      Open and closed have distinct semantics and must agree.
  - name: aliases
    auxiliary: true
    definition: >-
      Judge synonym correctness, not identical list coverage. Empty/different
      synonym lists are acceptable; aliases naming a different dimension fail.
      This auxiliary field is excluded from main schema metrics.
