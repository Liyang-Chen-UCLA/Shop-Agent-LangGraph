module: market_screening
version: 1
rubrics:
  - id: MS-1
    question: "入选 ID 是否都被搜索到、读过页面且没有重复？"
    pass: "每个入选商品都在筛选审计的候选中，有已读页面（或读过全文），且入选列表无重复。"
    fail: "入选商品未被搜索到、没有读过页面，或重复入选。"
    judge: code
    severity: veto
    maturity: active
    depends_on_gold: false
    data_source: "MarketResult.audit（stage=screening）"
  - id: MS-2
    question: "入选商品的筛选证据 source_text 是否是所读页面原文的子串？"
    pass: "每条筛选证据的 page_id 属于已读页面，且 source_text 去除所有空白后是该页 OCR 原文的子串。"
    fail: "页面未读过，或 source_text 不在页面原文中。"
    judge: code
    severity: veto
    maturity: active
    depends_on_gold: false
    data_source: "audit 的 evidence 与 read_page_ids；页面原文来自商品库或 sample.page_texts"
  - id: MS-3
    question: "入选商品是否不含参考标为不相关的商品？"
    pass: "没有入选商品属于 reference.irrelevant_item_ids。"
    fail: "入选了参考标为不相关的商品。"
    judge: code
    severity: veto
    maturity: active
    depends_on_gold: true
    data_source: "audit 的 selected；task.reference.irrelevant_item_ids"
  - id: MS-4
    question: "入选数量是否在 [3, 研究样本上限] 内？"
    pass: "入选数量 n 满足 3 ≤ n ≤ CONFIG.market.max_search_products。"
    fail: "数量过少或超过上限。"
    judge: code
    severity: gate
    threshold: 1.0
    maturity: active
    depends_on_gold: false
    data_source: "audit 的 selected；core.config.CONFIG"
  - id: MS-5
    question: "参考相关商品的召回率是多少？"
    pass: "参考相关商品被入选。"
    fail: "参考相关商品未被入选（受样本上限约束，仅作监控）。"
    judge: code
    severity: monitor
    maturity: active
    depends_on_gold: true
    data_source: "audit 的 selected；task.reference.relevant_item_ids"
