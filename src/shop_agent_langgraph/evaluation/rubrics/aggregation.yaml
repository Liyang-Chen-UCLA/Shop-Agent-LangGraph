module: aggregation
version: 2
rubrics:
  - id: AG-1
    question: "核心维度是否全部一对一匹配？"
    pass: "overlay.core_ids 中的每个 gold 维度所在 match 组恰为 1 个 gold 对 1 个 actual。"
    fail: "核心维度被判为 missing，或属于合并（多个 gold 对 1 个 actual）/拆分（1 个 gold 对多个 actual）组。"
    data_source: "EvalReport.match / missing；overlay.core_ids"
  - id: AG-3
    question: "已匹配维度的 kind、type 与字段存在性是否正确？"
    pass: "单一 kind/type 的匹配与 gold 一致；units/formula/direction/values/value_domain 在 gold 与 actual 两侧的存在性一致（由 deterministic_score 判定）。"
    fail: "kind 或 type 与 gold 不同，或某字段只在一侧存在。混合 kind/type 的合并组无法由代码判定，记为 unresolved。"
    data_source: "EvalReport.items / match；agents.eval.jev.deterministic_score"
  - id: AG-6
    question: "输出维度是否不含排除类别？"
    pass: "每个输出维度的名称与别名都不含 overlay.excluded_keywords 中的关键词。"
    fail: "出现价格、质保、销量等排除类别的维度。"
    data_source: "actual criteria / attributes 的 name 与 aliases；overlay.excluded_keywords"
  - id: AG-7
    question: "输出 ID 是否唯一，且 source_item_ids 等于输入？"
    pass: "criteria 与 attributes 的 ID 全部唯一，source_item_ids 与输入商品 ID 列表完全相同。"
    fail: "ID 重复，或 source_item_ids 与输入不同。"
    data_source: "actual CriteriaAttributeSet；输入商品 ID"
