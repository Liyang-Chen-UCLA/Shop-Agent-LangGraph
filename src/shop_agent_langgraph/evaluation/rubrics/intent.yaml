module: intent
version: 1
rubrics:
  - id: INT-1
    question: "action 是否等于参考？"
    pass: "output.action 与 reference.action 相同。"
    fail: "不同。"
    judge: code
    severity: gate
    threshold: 0.95
    maturity: active
    depends_on_gold: true
    data_source: "IntentResult.action；task.reference.action"
  - id: INT-2
    question: "category 是否正确？"
    pass: "参考为 null 时输出为 null；否则归一化（NFKC、忽略大小写与空白）后与参考相等。"
    fail: "参考为 null 但输出非 null，或归一化后不相等。"
    judge: code
    severity: gate
    threshold: 0.9
    maturity: active
    depends_on_gold: true
    data_source: "IntentResult.category；task.reference.category"
  - id: INT-3
    question: "每条输出偏好在用户原话中是否有依据？"
    pass: "每条偏好都能追溯到用户消息或对话上下文。"
    fail: "出现用户没有表达过的偏好。"
    judge: llm
    severity: veto
    maturity: shadow
    depends_on_gold: false
    data_source: "IntentResult 偏好；输入消息与上下文"
  - id: INT-4
    question: "参考偏好是否被召回（criteria 与 attribute 分别计）？"
    pass: "参考中的每条偏好在对应列表中都有语义等价的输出。"
    fail: "参考偏好缺失或被放入错误列表。"
    judge: llm
    severity: gate
    threshold: 0.8
    maturity: shadow
    depends_on_gold: true
    data_source: "IntentResult.criteria_preferences / attribute_preferences；task.reference"
  - id: INT-5
    question: "用户消息中的数字（预算、数量）是否在输出中原样保留？"
    pass: "create/update/switch 的用户消息中每个阿拉伯数字，都以原样数字出现在类别或偏好中。"
    fail: "数字丢失、被改写或被舍入。"
    judge: code
    severity: veto
    maturity: active
    depends_on_gold: false
    data_source: "输入消息；IntentResult 的 category 与偏好"
